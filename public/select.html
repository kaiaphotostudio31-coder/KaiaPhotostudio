<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaia — Pilih Foto</title><link rel="stylesheet" href="/assets/style.css"><style>.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photo{border:2px solid transparent;border-radius:12px;overflow:hidden;background:#fff;cursor:pointer}.photo.sel{border-color:var(--bronze)}.photo img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}.photo div{padding:7px;font-size:12px}.controls{position:sticky;bottom:0;background:rgba(250,247,241,.96);padding:14px 0;border-top:1px solid var(--line)}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="section"><div id="app">Memuat foto…</div></main><script>
const token=location.pathname.split('/').filter(Boolean).pop();let state=null,selected=new Set();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const r=await fetch('/api/selection/'+encodeURIComponent(token));const d=await r.json();if(!r.ok){document.getElementById('app').innerHTML='<div class="error-box">'+esc(d.error)+'</div>';return;}state=d;render();}
function render(){const a=document.getElementById('app');const templates=(state.templates||[]).filter(t=>t.status==='IMPLEMENTED');a.innerHTML=`<h1>Pilih foto kamu ✦</h1><p class="hint">${esc(state.session.customerName)} · ${esc(state.session.bookingCode)}</p><div class="grid">${(state.photos||[]).map(p=>`<button class="photo ${selected.has(p.id)?'sel':''}" onclick="toggle(${p.id})"><img src="${esc(p.thumbnail_url||'')}" alt="${esc(p.display_name)}"><div>${esc(p.display_name)}</div></button>`).join('')}</div><div class="card" style="margin-top:18px"><label>Template</label><select id="template">${templates.map(t=>`<option value="${esc(t.code)}">${esc(t.name)}</option>`).join('')}</select><label style="display:block;margin-top:12px">Warna</label><select id="color"><option value="#1a3961">Biru — #1a3961</option><option value="#000000">Hitam — #000000</option></select></div><div class="controls"><b id="count">${selected.size} foto dipilih</b><button class="btn-primary" style="margin-left:12px" onclick="submitSelection()">Submit Pilihan</button></div>`;updateColors();document.getElementById('template').onchange=updateColors;}
function toggle(id){selected.has(id)?selected.delete(id):selected.add(id);render();}
function updateColors(){const t=state.templates.find(x=>x.code===document.getElementById('template')?.value);if(!t)return;const c=document.getElementById('color');const allowed=t.config?.supportedColors||[];c.innerHTML=allowed.map(x=>`<option value="${esc(x)}">${x==='#1a3961'?'Biru — ':x==='#000000'?'Hitam — ':''}${esc(x)}</option>`).join('');if(!allowed.length)c.innerHTML='<option value="">Belum dikonfigurasi</option>';}
async function submitSelection(){const templateCode=document.getElementById('template').value,color=document.getElementById('color').value;const r=await fetch('/api/selection/'+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({photoIds:[...selected],templateCode,color})});const d=await r.json();if(!r.ok){alert(d.error);return;}document.getElementById('app').innerHTML='<div class="success-box"><h2>Pilihan foto sudah tersimpan ✦</h2><p>Terima kasih. Tim Kaia akan memproses pilihanmu.</p></div>';}
load();</script></body></html>
